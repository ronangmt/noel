<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3b2a">
  <meta name="robots" content="noindex, nofollow">
  <title>Noël en famille</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🎄</span>
      <h1 id="site-title">Noël en famille</h1>
    </div>
    <div class="countdown" id="countdown"></div>
    <div class="top-actions">
      <button id="snow-toggle" class="icon-btn" type="button" title="Activer / couper la neige" aria-label="Activer ou couper la neige">❄️</button>
      <div id="user-chip"></div>
    </div>
  </header>

  <main id="app" class="container">
    <div class="loading">Chargement de la magie de Noël… ✨</div>
  </main>

  <footer class="footer">Fait avec ❤️ pour Noël</footer>

  <script type="module" src="js/app.js?v=6"></script>
</body>
</html>
